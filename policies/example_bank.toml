# Example tenant: first weeks in monitor mode, a modem-support desk, its own site trusted.

version = "2026-09-24.1"
mode = "monitor"
log_excerpt = true
disabled_rules = ["url_check.ip_address_host"]   # customers paste 192.168.1.1 when asking about modems

[layers]
code_payloads = "shadow"

[url_check]
allowed_hosts = ["www.examplebank.com.tr"]

[tools.hat_durumu]       # read-only: runs as soon as the arguments check out
params = { telefon = "str" }
from_user = ["telefon"]  # only the line the customer gave, not one the model found elsewhere

[tools.ariza_kaydi_ac]
params = { telefon = "str", aciklama = "str", oncelik = "integer" }
optional = ["oncelik"]
min = { oncelik = 1 }
max = { oncelik = 3 }
from_user = ["telefon"]
confirm = true           # opens a ticket: the customer confirms first
