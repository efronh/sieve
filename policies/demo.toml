# For the page the server serves with --ui: the base policy, enforced, with the example bank's two tools, so every
# boundary on the page has something to decide. python -m sieve.server --tenant demo --ui

version = "2026-10-13.1"

[url_check]
allowed_hosts = ["www.examplebank.com.tr"]

[tools.hat_durumu]       # read-only: runs as soon as the arguments check out
params = { telefon = "line" }
from_user = ["telefon"]  # only the line the customer gave, not one the model found elsewhere

[tools.ariza_kaydi_ac]
params = { telefon = "line", aciklama = "str", oncelik = "integer" }
optional = ["oncelik"]
min = { oncelik = 1 }
max = { oncelik = 3 }
from_user = ["telefon"]
confirm = true           # opens a ticket: the customer confirms first
