# Pull requests for new versions of the locked dependencies and the pinned actions, weekly. Each goes through CI,
# replay and bypass gates included, before it's merged by hand. One pull request a week for each: the first run
# opened ten at once, one per package.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # The lock is a pip freeze, which Dependabot bumps line by line without resolving it: torch needs sympy, which
    # takes mpmath below 1.4, and a bump past that couldn't be installed.
    ignore:
      - dependency-name: mpmath
        versions: [">=1.4"]
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
