name: CI

on:
  push:
  pull_request:
  # New vulnerabilities are published while the code stands still: the security job runs weekly as well.
  schedule:
    - cron: "17 5 * * 1"

# The token can read the repository and nothing else.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      # Actions are pinned to a commit, not a tag a compromised account could move; the comment says which release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      # Core + dev only, at the locked versions, plus AnyJev at the same commit as the [llm] extra. AnyJev's core needs
      # just numpy, so the LLM layer is tested on its fake backend; tests that need torch or sentence-transformers skip
      # themselves.
      - run: pip install -c requirements-lock.txt -e ".[dev]" "anyjev @ git+https://github.com/nokia-applied-research/AnyJev.git@149e7f71949c08b57492ef7025b67a763c600a0f"
      - run: ruff check .
      - run: pytest
      # Security regression gate: replays corpus/ (TF-IDF without BERTurk, as installed here) and fails if an
      # attack the baseline caught gets through, recall drops below its floor, or the ML layer didn't load.
      - run: python -m scripts.replay --baseline check
      # Bypass gate: the corpus's caught attacks rewritten (encodings, Unicode, alphabets, languages, places in a
      # document, a conversation, answers and tool calls) must stay caught; fails if one the baseline caught gets
      # through (corpus/bypass_baseline.json).
      - run: python -m scripts.bypass_suite --baseline check
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: replay-${{ matrix.python-version }}
          path: |
            results/replay.json
            results/bypass.json
          if-no-files-found: ignore

  # Known vulnerabilities in the locked dependencies, the code scan, secrets anywhere in the history and the slow-pattern
  # fuzzer, and one report with the test job's replay and bypass results. Every check runs even when one before it
  # fails, so the report is whole; the job fails if any did.
  security:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0  # gitleaks reads every commit
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      # AnyJev too: the fuzzer imports every module of sieve/, the LLM layer among them.
      - run: pip install -c requirements-lock.txt -e ".[dev]" pip-audit bandit "anyjev @ git+https://github.com/nokia-applied-research/AnyJev.git@149e7f71949c08b57492ef7025b67a763c600a0f"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        continue-on-error: true  # a failed test job may have left none; the report then says so
        with:
          name: replay-3.13
          path: results
      - name: Known vulnerabilities in the locked dependencies (pip-audit)
        if: always()
        run: pip-audit -r requirements-lock.txt --no-deps --disable-pip --progress-spinner off -f json -o results/pip_audit.json
      - name: Code (bandit)
        if: always()
        run: bandit -q -r sieve -f json -o results/bandit.json
      - name: Secrets in the whole history (gitleaks)
        if: always()
        shell: bash
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --report-format json --report-path results/gitleaks.json .
      - name: Slow patterns (fuzzer)
        if: always()
        shell: bash
        run: python -m scripts.fuzz_slow_inputs --patterns | tee results/fuzz.txt
      - name: Security report
        if: always()
        run: python -m scripts.security_report
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: security-report
          path: |
            results/security_report.md
            results/pip_audit.json
            results/bandit.json
            results/gitleaks.json
            results/fuzz.txt
          if-no-files-found: ignore

  # The default setup, as shipped: TF-IDF, then BERTurk when TF-IDF is unsure. The job above has no torch, so it
  # checks TF-IDF alone and skips the tests that need sentence-transformers; this one runs them and replays corpus/
  # against corpus/baseline_cascade.json.
  cascade:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      # CPU wheels: the default torch wheel brings CUDA libraries, a few GB a runner can't use. The lock's torch pin
      # takes the CPU build of the same version.
      - run: pip install -c requirements-lock.txt torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -c requirements-lock.txt -e ".[dev,ml]" "anyjev @ git+https://github.com/nokia-applied-research/AnyJev.git@149e7f71949c08b57492ef7025b67a763c600a0f"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: hf-dbmdz-bert-base-turkish-cased-b6e1de16  # the revision REVISIONS pins
      - run: pytest
      - run: python -m scripts.replay --baseline check --cascade
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: replay-cascade
          path: results/replay.json
          if-no-files-found: ignore
